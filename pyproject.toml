[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-recommender"
version = "0.1.0"
description = "Personalized Product Recommender System (2016-2017 ML engineering style)"
requires-python = ">=3.9"
readme = "README.md"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scikit-surprise>=1.1.3",
    "flask>=2.3",
    "gunicorn>=21",
    "redis>=4.6",
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
mlflow = [
    "mlflow>=2.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
