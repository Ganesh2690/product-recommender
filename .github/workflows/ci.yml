name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 -r requirements.txt
          pip install -e .   # editable install so all src.* subpackages resolve correctly

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503 --count --statistics

      - name: Run tests with pytest
        env:
          FLASK_ENV: testing
          REDIS_URL: ""     # Tests use local fallback cache
        run: |
          pytest tests/ -v --tb=short -x

      - name: Check log scripts
        run: |
          python scripts/check_logs.py || true
